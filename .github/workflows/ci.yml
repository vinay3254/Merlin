name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=student_resource/dataset
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=student_resource/dataset

      - name: Run unit tests
        run: |
          if [ -d tests ] || [ -d code/business_entity_resolution/tests ]; then
            pytest
          else
            echo "No tests directory found yet. Skipping pytest."
          fi
