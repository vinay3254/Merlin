name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f code/business_entity_resolution/requirements.txt ]; then pip install -r code/business_entity_resolution/requirements.txt; fi
          pip install pytest flake8

      - name: Lint critical syntax
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 code/business_entity_resolution --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit test suite
        run: |
          PYTHONPATH=code/business_entity_resolution/src pytest code/business_entity_resolution/tests
